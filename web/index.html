<html lang="en">
  <head>
    <meta charset="utf-8" />

    <title>Instant Site Chat — Kleio</title>

    <!-- Tab icon. The .ico carries hand-tuned 16-64px frames for browsers that

         take it win the cascade and scale cleanly on any display. -->
    <link rel="icon" href="/favicon.ico" sizes="16x16 24x24 32x32 48x48 64x64" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#5B2A86" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&display=swap" rel="stylesheet" />
  </head>
